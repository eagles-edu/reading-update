<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="preload" href="../style/font-stack.css" as="style" integrity="sha384-vUruqAnVDOvPl9cKsjkKIwbhwldrr4SyS1jTJvuhaqKeTlMF/MRcJ39//nKy7MhS">
<link rel="stylesheet" href="../style/font-stack.css" integrity="sha384-vUruqAnVDOvPl9cKsjkKIwbhwldrr4SyS1jTJvuhaqKeTlMF/MRcJ39//nKy7MhS">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="IELTS Reading with seven lettered tabs and 545 English reading texts."
    >
    <title>IELTS Reading</title>
    <link href="/reading/favicon.ico" rel="shortcut icon" type="image/vnd.microsoft.icon">
    <link rel="preload" href="../js/theme-selector.js" as="script" integrity="sha384-Z1/JSOxBq9/FDcKgAV/WlspujLmY1FVDWPKUBtGpMaemJRTV4PhhWDV5ftWg8zni">
<script src="../js/theme-selector.js" integrity="sha384-Z1/JSOxBq9/FDcKgAV/WlspujLmY1FVDWPKUBtGpMaemJRTV4PhhWDV5ftWg8zni"></script>
<script>
      (() => {
        const storageKey = "theme";
        const root = document.documentElement;

        try {
          const savedTheme = localStorage.getItem(storageKey);
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme =
            savedTheme === "light" || savedTheme === "dark"
              ? savedTheme
              : prefersDark
                ? "dark"
                : "light";

          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch {
          root.dataset.theme = "light";
          root.style.colorScheme = "light";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --accent: var(--brand-primary);
        --accent-contrast: #ffffff;
        --accent-strong: var(--brand-primary-dark);
        --bg-accent: rgba(181, 0, 16, 0.08);
        --bg-accent-2: rgba(0, 39, 134, 0.08);
        --brand-primary: #b50010;
        --brand-primary-dark: #86000c;
        --brand-secondary: #f5f8ff;
        --brand-tertiary: #002786;
        --brand-primary-dm: #ff4a5f;
        --brand-primary-dm-dark: #d93c52;
        --brand-secondary-dm: #7da2ff;
        --brand-secondary-dm-dark: #3b73ff;
        --border: #8d929e;
        --focus-ring: rgba(0, 39, 134, 0.32);
        --feature-bg-end: var(--brand-primary);
        --feature-bg-start: var(--brand-tertiary);
        --footer-bg: var(--brand-tertiary);
        --footer-border: rgba(255, 255, 255, 0.18);
        --footer-text: #e4e9f2;
        --max-width: 1120px;
        --muted: #5f6b82;
        --on-accent: #ffffff;
        --on-accent-muted: rgba(255, 255, 255, 0.78);
        --page-bg: #d3d9e5;
        --primary-color: #b50010;
        --primary-dark: var(--brand-primary-dark);
        --secondary-color: #f5f8ff;
        --shell-bg: rgba(255, 255, 255, 0.92);
        --shell-shadow: 0 14px 34px rgba(0, 39, 134, 0.09);
        --shadow: 0 18px 45px rgba(0, 39, 134, 0.12);
        --surface: #ffffff;
        --surface-soft: #f3f5ff;
        --surface-strong: #ffffff;
        --tertiary-color: #002786;
        --text: #212121;
        --theme-toggle-icon-bg: rgba(255, 255, 255, 0.78);
        --theme-toggle-icon-bg-dark: rgba(255, 255, 255, 0.12);
        --theme-toggle-ink: #172033;
        --theme-toggle-ink-dark: #ffd76a;
        --radius-base: 3.667px;
        --radius-pill: 999px;
        --radius-1: var(--radius-base);
        --radius-2: calc(var(--radius-base) * 2);
        --radius-3: calc(var(--radius-base) * 3);
        --space-1: clamp(8px, 0.75vw, 10px);
        --space-2: clamp(12px, 1.1vw, 14px);
        --space-3: clamp(16px, 1.8vw, 20px);
        --space-4: clamp(22px, 2.2vw, 28px);
        --space-5: clamp(30px, 3vw, 40px);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --accent: var(--brand-primary-dm);
        --accent-contrast: #101010;
        --accent-strong: var(--brand-secondary-dm);
        --bg-accent: rgba(255, 74, 95, 0.08);
        --bg-accent-2: rgba(126, 163, 255, 0.03);
        --border: #555555;
        --focus-ring: rgba(126, 163, 255, 0.38);
        --feature-bg-end: #323232;
        --feature-bg-start: #161616;
        --footer-bg: var(--brand-tertiary);
        --footer-border: rgba(255, 255, 255, 0.18);
        --footer-text: #e4e9f2;
        --muted: #c2c2c2;
        --page-bg: #050505;
        --primary-color: var(--brand-primary-dm);
        --primary-dark: var(--brand-primary-dm-dark);
        --secondary-color: #111111;
        --shell-bg: rgba(22, 22, 22, 0.94);
        --shell-shadow: 0 16px 34px rgba(0, 0, 0, 0.48);
        --shadow: 0 18px 42px rgba(0, 0, 0, 0.5);
        --surface: #262626;
        --surface-soft: #333333;
        --surface-strong: #141414;
        --tertiary-color: var(--brand-secondary-dm);
        --text: #f0f0f0;
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
      }

      body {
        color: var(--text);
        line-height: 1.6;
        margin: 0;
        isolation: isolate;
        font-family: var(--font-base);
        background:
          radial-gradient(circle at top left, var(--bg-accent), transparent 32rem),
          radial-gradient(
            circle at top right,
            var(--bg-accent-2),
            transparent 34rem
          ),
          var(--page-bg);
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -20vh -10vw auto;
        height: 55vh;
        background:
          radial-gradient(
            circle at 22% 30%,
            rgba(181, 0, 16, 0.12),
            transparent 55%
          ),
          radial-gradient(
            circle at 78% 38%,
            rgba(0, 39, 134, 0.14),
            transparent 50%
          );
        filter: blur(18px);
        opacity: 0.82;
        pointer-events: none;
        z-index: -1;
        animation: drift 18s ease-in-out infinite alternate;
      }

      @keyframes drift {
        from {
          transform: translate3d(-0.75rem, 0, 0);
        }

        to {
          transform: translate3d(0.75rem, -0.4rem, 0);
        }
      }

      :focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img,
      svg {
        display: block;
        max-width: 100%;
      }

      .container {
        margin-inline: auto;
        width: min(100% - 32px, var(--max-width));
      }

      .sr-only {
        border: 0;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        height: 1px;
        margin: -1px;
        overflow: hidden;
        padding: 0;
        position: absolute;
        width: 1px;
        white-space: nowrap;
      }

      .shell {
        background: var(--shell-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-3);
        box-shadow: var(--shell-shadow);
        overflow: hidden;
      }

      .section-shell {
        display: grid;
        gap: var(--space-3);
        padding: var(--space-2) var(--space-4);
      }

      .site-header {
        background: transparent;
        padding: 12px 0 0;
        position: static;
      }

      .hub-banner {
        align-items: center;
        background: var(--primary-color);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: var(--radius-2);
        color: var(--secondary-color);
        display: flex;
        font-size: 1.25rem;
        font-weight: 700;
        justify-content: space-between;
        letter-spacing: 0.08em;
        line-height: 1;
        min-block-size: 18px;
        margin-top: var(--space-2);
        padding-block: 8px;
        padding-inline: calc(var(--space-2) * 1.9);
        width: 100%;
      }

      .hub-banner a {
        color: inherit;
        font-size: 1.25rem;
        font-weight: inherit;
        text-decoration: none;
        transition: color 120ms ease, text-decoration-color 120ms ease;
      }

      .hub-banner a:hover,
      .hub-banner a:focus-visible {
        color: var(--accent-contrast);
        text-decoration: underline;
        text-underline-offset: 5px;
      }

      .nav {
        align-items: center;
        display: flex;
        flex-direction: row;
        gap: var(--space-3);
        justify-content: flex-start;
        min-height: 56px;
        padding: 10px 0;
      }

      .brand {
        align-items: center;
        color: var(--tertiary-color);
        display: inline-flex;
        font-size: 1.14rem;
        font-weight: 950;
        gap: 10px;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
        min-width: 0;
      }

      .brand-title {
        color: var(--text);
        display: inline-block;
        font-size: clamp(0.98rem, 0.8vw + 0.72rem, 1.25rem);
        font-variant-numeric: tabular-nums;
        font-weight: 950;
        letter-spacing: 0.01em;
        line-height: 1;
        white-space: nowrap;
      }

      /* CHANGE: Header mark now uses the supplied logo as inline SVG, removing the external logo image dependency. */
      .brand-mark {
        background: linear-gradient(
          180deg,
          var(--surface-strong) 0%,
          var(--surface-soft) 100%
        );
        border-radius: var(--radius-1);
        box-shadow: var(--shadow);
        display: grid;
        height: 44px;
        overflow: hidden;
        place-items: center;
        width: 44px;
      }

      .brand-mark svg {
        display: block;
        height: 36px;
        width: 36px;
      }

      .nav-links {
        display: none;
      }

      .nav-actions {
        display: flex;
      }

      .btn {
        align-items: center;
        border: 1px solid transparent;
        border-radius: var(--radius-2);
        cursor: pointer;
        display: inline-flex;
        font-weight: 800;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease,
          border-color 160ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--primary);
        box-shadow: var(--shadow);
        color: var(--accent-contrast);
      }

      .btn-primary:hover {
        background: var(--primary-dark);
      }

      .btn-ghost {
        background: var(--surface);
        border-color: var(--border);
        color: var(--tertiary-color);
      }

      .btn-ghost:hover {
        border-color: var(--accent);
      }

      .header-link {
        align-items: center;
        color: var(--tertiary-color);
        display: inline-flex;
        font-size: 0.95rem;
        font-weight: 800;
        justify-content: center;
        text-decoration: none;
        white-space: nowrap;
      }

      .header-link:hover,
      .header-link:focus-visible {
        color: var(--primary);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .theme-toggle {
        align-items: center;
        appearance: none;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-pill);
        color: var(--theme-toggle-ink);
        cursor: pointer;
        display: inline-flex;
        justify-content: center;
        justify-self: end;
        min-height: 44px;
        padding: 8px;
        position: relative;
        transition:
          background-color 180ms ease,
          border-color 180ms ease,
          color 180ms ease,
          transform 180ms ease;
      }

      .theme-toggle:hover {
        border-color: rgba(15, 22, 41, 1);
        transform: translateY(-1px);
      }

      .theme-toggle__icon {
        align-items: center;
        background: var(--theme-toggle-icon-bg);
        border-radius: var(--radius-pill);
        color: var(--theme-toggle-ink);
        display: inline-flex;
        flex: 0 0 auto;
        height: 38px;
        justify-content: center;
        width: 38px;
      }

      .theme-toggle__icon svg {
        color: inherit;
        display: none;
        height: 100%;
        width: 100%;
      }

      .theme-toggle__icon[data-theme-icon="moon"] .theme-toggle__icon-moon,
      .theme-toggle__icon[data-theme-icon="sun"] .theme-toggle__icon-sun {
        display: block;
      }

      html[data-theme="dark"] .theme-toggle {
        background: transparent;
        border-color: transparent;
        color: var(--theme-toggle-ink-dark);
      }

      html[data-theme="dark"] .theme-toggle:hover {
        border-color: rgba(255, 215, 106, 0.42);
      }

      html[data-theme="dark"] .theme-toggle__icon {
        background: var(--theme-toggle-icon-bg-dark);
        color: var(--theme-toggle-ink-dark);
      }

      html[data-theme="dark"] .brand {
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.28);
      }

      html[data-theme="dark"] .hub-banner {
        align-items: center;
        background: var(--brand-primary-dark);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: var(--radius-2);
        color: #e4e9f2;
        display: flex;
        font-size: 1.25rem;
        font-weight: 700;
        justify-content: space-between;
        letter-spacing: 0.08em;
        line-height: 1;
        min-block-size: 18px;
        margin-top: var(--space-2);
        padding-block: 8px;
        padding-inline: calc(var(--space-2) * 1.9);
        width: 100%;
      }

      html[data-theme="dark"] .hub-banner a {
        color: inherit;
        font-size: 1.25rem;
        font-weight: inherit;
        text-decoration: none;
        transition: color 120ms ease, text-decoration-color 120ms ease;
      }

      html[data-theme="dark"] .hub-banner a:hover,
      html[data-theme="dark"] .hub-banner a:focus-visible {
        color: #e4e9f2;
        text-decoration: underline;
        text-underline-offset: 5px;
      }

      html[data-theme="dark"] .hero-panel {
        background: #161616;
        border-color: rgba(255, 255, 255, 0.14);
        box-shadow:
          0 18px 38px rgba(0, 0, 0, 0.42),
          0 0 0 1px color-mix(in srgb, var(--brand-primary-dm) 26%, transparent) inset,
          0 1px 0 rgba(255, 255, 255, 0.05) inset;
      }

      html[data-theme="dark"] .stat-chip {
        background: #262626;
        border-color: rgba(255, 255, 255, 0.14);
        box-shadow:
          0 12px 24px rgba(0, 0, 0, 0.34),
          0 0 0 1px color-mix(in srgb, var(--brand-primary-dm) 22%, transparent) inset,
          0 1px 0 rgba(255, 255, 255, 0.08) inset;
      }

      html[data-theme="dark"] .stat-chip strong {
        color: var(--primary-color);
      }

      html[data-theme="dark"] .tab-button {
        background: linear-gradient(180deg, #333333, #262626);
        border-color: rgba(255, 255, 255, 0.14);
        box-shadow:
          0 -1px 0 rgba(255, 255, 255, 0.04) inset,
          0 0 0 1px color-mix(in srgb, var(--brand-primary-dm) 22%, transparent) inset;
      }

      html[data-theme="dark"] .tab-button[aria-selected="true"] {
        background: linear-gradient(180deg, #262626, #1f1f1f);
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow:
          0 -1px 0 rgba(255, 255, 255, 0.08) inset,
          0 0 0 1px color-mix(in srgb, var(--brand-primary-dm) 34%, transparent) inset,
          0 10px 16px rgba(0, 0, 0, 0.26);
      }

      html[data-theme="dark"] .tab-panels {
        background: #161616;
        border-color: rgba(255, 255, 255, 0.14);
        box-shadow:
          0 18px 38px rgba(0, 0, 0, 0.42),
          0 0 0 1px color-mix(in srgb, var(--brand-secondary-dm) 18%, transparent) inset,
          0 1px 0 rgba(255, 255, 255, 0.05) inset;
      }

      .theme-toggle:focus-visible {
        box-shadow: 0 0 0 3px rgba(47, 91, 227, 0.2);
        outline: none;
      }

      .hero {
        padding: var(--space-4) 0 var(--space-3);
      }

      .hero-panel {
        background:
          radial-gradient(circle at top left, var(--bg-accent), transparent 34%),
          radial-gradient(
            circle at bottom right,
            var(--bg-accent-2),
            transparent 36%
          ),
          var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-3);
        box-shadow: var(--shell-shadow);
        overflow: hidden;
        padding: var(--space-4);
        position: relative;
      }

      .hero-panel::before,
      .hero-panel::after {
        content: "";
        position: absolute;
        border-radius: var(--radius-pill);
        pointer-events: none;
      }

      .hero-panel::before {
        inset: auto auto 1rem -2rem;
        width: 8rem;
        height: 8rem;
        background: radial-gradient(
          circle,
          color-mix(in srgb, var(--primary-color) 30%, transparent),
          transparent 72%
        );
        opacity: 0.5;
      }

      .hero-panel::after {
        inset: 1rem -1rem auto auto;
        width: 6rem;
        height: 6rem;
        background: radial-gradient(
          circle,
          color-mix(in srgb, var(--tertiary-color) 30%, transparent),
          transparent 70%
        );
        opacity: 0.42;
      }

      .eyebrow {
        align-items: center;
        background: var(--secondary-color);
        border: 1px solid var(--tertiary-color);
        border-radius: var(--radius-2);
        color: var(--primary-color);
        display: inline-flex;
        font-size: 0.88rem;
        font-weight: 900;
        gap: var(--space-1);
        margin-bottom: var(--space-2);
        padding: 7px 12px;
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      h1 {
        color: var(--tertiary-color);
        font-size: clamp(1.62rem, 2.8vw, 2.72rem);
        letter-spacing: -0.035em;
        line-height: 1.04;
        max-width: 16ch;
      }

      html[data-theme="dark"] h1 {
        color: var(--on-accent-soft);
      }

      .hero-copy {
        color: var(--muted);
        font-size: clamp(0.98rem, 0.95vw + 0.72rem, 1.02rem);
        line-height: 1.48;
        margin-top: var(--space-3);
        max-width: 900px;
      }

      .hero-stats {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-top: var(--space-3);
        position: relative;
        z-index: 1;
      }

      .stat-chip {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-3);
        box-shadow:
          0 10px 22px rgba(0, 39, 134, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        padding: 16px 14px;
      }

      .stat-chip strong {
        color: var(--primary-color);
        display: block;
        font-variant-numeric: tabular-nums;
        font-size: clamp(1.18rem, 1.05vw + 0.7rem, 1.34rem);
        line-height: 1.1;
      }

      .stat-chip strong.is-animating {
        opacity: 0.92;
        transition: opacity 180ms ease;
      }

      .stat-counter strong {
        font-variant-numeric: tabular-nums;
      }

      .stat-chip span {
        color: var(--muted);
        display: block;
        font-size: clamp(0.82rem, 0.45vw + 0.66rem, 0.88rem);
        font-weight: 700;
        margin-top: 2px;
      }

      .tabs-shell {
        position: relative;
      }

      .tabbed-shell {
        display: grid;
        gap: 0;
      }

      .tab-list {
        align-items: flex-end;
        border-bottom: none;
        display: flex;
        flex-wrap: nowrap;
        gap: 0;
        justify-content: flex-start;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 0;
        -ms-overflow-style: none;
      }

      .tab-list::-webkit-scrollbar {
        display: none;
      }

      .tab-button {
        background: linear-gradient(180deg, var(--surface-soft), var(--surface));
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.42) inset;
        color: var(--tertiary-color);
        cursor: pointer;
        align-items: baseline;
        display: inline-flex;
        gap: clamp(0.45rem, 1vw, 0.85rem);
        flex: 0 0 auto;
        margin-bottom: -1px;
        min-width: clamp(9.5rem, 20vw, 12.25rem);
        overflow: hidden;
        padding: 13px 30px 12px 20px;
        position: relative;
        text-align: left;
        white-space: nowrap;
        transition:
          transform 220ms ease,
          box-shadow 220ms ease,
          border-color 220ms ease,
          background-color 220ms ease;
        clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 100%, 0 100%);
      }

      .tab-button:not(:first-child) {
        margin-left: -8px;
      }

      .tab-button::before {
        content: "";
        inset: 0;
        position: absolute;
        background: linear-gradient(125deg, transparent 20%, rgba(255, 255, 255, 0.18) 50%, transparent 80%);
        opacity: 0;
        pointer-events: none;
        transform: translateX(-34%) skewX(-16deg);
        transition:
          opacity 320ms ease,
          transform 520ms ease;
      }

      .tab-button:hover,
      .tab-button:focus-visible {
        border-color: color-mix(
          in srgb,
          var(--primary-color) 45%,
          var(--border)
        );
        box-shadow: 0 -8px 18px color-mix(in srgb, var(--tertiary-color) 14%, transparent);
        transform: translateY(-2px);
      }

      .tab-button:hover::before,
      .tab-button:focus-visible::before,
      .tab-button[aria-selected="true"]::before {
        opacity: 1;
        transform: translateX(36%) skewX(-16deg);
      }

      .tab-button[aria-selected="true"] {
        background: linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 94%, #ffffff));
        border-color: color-mix(in srgb, var(--primary-color) 28%, var(--border));
        border-bottom-color: var(--surface);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.6) inset,
          0 0 0 1px rgba(255, 255, 255, 0.34) inset,
          0 12px 18px rgba(0, 39, 134, 0.22);
        color: var(--primary-color);
        filter: none;
        z-index: 5;
        transform: none;
      }

      .story-item {

        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--surface-soft) 92%, #F3F5FF),
          color-mix(in srgb, var(--surface) 84%, #ffffff)

        border: 1px solid color-mix(in srgb, var(--primary-color) 50%, var(--border));
        border-radius: 18px;
        box-shadow:
          0 10px 22px color-mix(in srgb, var(--tertiary-color) 12%, transparent),
          0 1px 0 rgba(255, 255, 255, 0.55) inset;
        display: grid;
        gap: 12px;
        grid-template-columns: auto 1fr auto;
        padding: 13px 14px;
        position: relative;
        overflow: hidden;
        transition:
          transform 180ms ease,
          background-color 150ms ease,
          border-color 150ms ease,
          box-shadow 180ms ease,
          filter 180ms ease;
        break-inside: avoid;
        display: inline-grid;
        width: 100%;
        margin: 0 0 10px;
      }

      .story-item::before {
        content: "";
        inset: 0;
        position: absolute;
        background: linear-gradient(
          115deg,
          transparent 28%,
          color-mix(in srgb, var(--tertiary-color) 24%, rgba(255, 255, 255, 0.76)) 50%,
          transparent 72%

        opacity: 0;
        pointer-events: none;
        transform: translateX(-38%) skewX(-18deg);
        transition:
          opacity 320ms ease,
          transform 520ms ease;

      @keyframes story-hover-pop {
        0% {
          transform: translateY(0);

        45% {
          transform: translateY(-6px);
        }

        100% {
          transform: translateY(-5px);
        }

      @keyframes story-hover-sheen {
        0% {
          opacity: 0;
          transform: translateX(-40%) skewX(-18deg);
        }

        100% {
          opacity: 1;
          transform: translateX(40%) skewX(-18deg);
        }
      }

      .story-item:hover,
      .story-item:focus-visible {
        background: linear-gradient(
          180deg,
          #f7f9ff,
          #eef3ff

        border-color: color-mix(
          in srgb,
          var(--primary-color) 30%,

          0 18px 36px rgba(0, 39, 134, 0.14),
          0 0 0 1px rgba(255, 255, 255, 0.18) inset;
        filter: saturate(1.02);

        transform: translateY(-5px);
        animation: story-hover-pop 220ms ease-out;
      }

      .story-item:hover::before,
      .story-item:focus-visible::before {
        opacity: 1;
        transform: translateX(38%) skewX(-18deg);
        animation: story-hover-sheen 360ms ease-out;

        padding: 0 12px;
        white-space: nowrap;
        transition:

          box-shadow 180ms ease,

      (() => {
        const storageKey = "theme";
        const root = document.documentElement;
        const themeToggle = document.querySelector("[data-theme-toggle]");
        const themeIcon = document.querySelector("[data-theme-toggle-icon]");

        const applyTheme = (theme) => {
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          if (themeToggle) {
            themeToggle.setAttribute(
              "aria-pressed",
              String(theme === "dark"),
            );
            themeToggle.setAttribute(
              "aria-label",
              theme === "dark"
                ? "Switch to light theme"
                : "Switch to dark theme",
            );
          }
          if (themeIcon) {
            themeIcon.dataset.themeIcon = theme === "dark" ? "sun" : "moon";
          }
        };

        if (themeToggle) {
          themeToggle.addEventListener("click", () => {
            const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
            if (
              window.ThemeSelector &&
              typeof window.ThemeSelector.setTheme === "function"
            ) {
              window.ThemeSelector.setTheme(nextTheme);
            } else {
              applyTheme(nextTheme);
            }
            try {
              localStorage.setItem(storageKey, nextTheme);
            } catch {
              // Ignore storage failures.
            }
          });
        }

        applyTheme(root.dataset.theme === "dark" ? "dark" : "light");
      })();

      (() => {
        const visitStorageKey = "visit-count";
        const visitGuardCookie = "visit-count-guard";
        const visitGuardSeconds = 60 * 60;
        const yearNode = document.querySelector("[data-current-year]");
        const visitCountNode = document.querySelector("[data-visit-count]");
        const metricNodes = Array.from(
          document.querySelectorAll("[data-count-target]"),
        );

        const getCookieValue = (name) => {
          const prefix = `${name}=`;
          const entry = document.cookie
            .split("; ")
            .find((part) => part.startsWith(prefix));
          return entry ? decodeURIComponent(entry.slice(prefix.length)) : "";
        };

        const setCookieValue = (name, value, maxAgeSeconds) => {
          document.cookie = `${name}=${encodeURIComponent(value)}; Path=/; Max-Age=${maxAgeSeconds}; SameSite=Lax`;
        };

        if (yearNode) {
          yearNode.textContent = String(new Date().getFullYear());
        }

        const runSpinCounter = (
          node,
          target,
          { suffix = "", duration = 2200 } = {},
        ) => {
          const start = performance.now();
          const startValue = 0;
          const animateFrame = (now) => {
            const elapsed = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(2, -10 * elapsed);
            const value = Math.round(startValue + (target - startValue) * eased);
            node.textContent = `${value}${suffix}`;

            if (elapsed < 1) {
              requestAnimationFrame(animateFrame);
            } else {
              node.classList.remove("is-animating");
              node.textContent = `${target}${suffix}`;
            }
          };

          node.classList.add("is-animating");
          requestAnimationFrame(animateFrame);
        };

        const getCounterTarget = async (node) => {
          if (node === visitCountNode) {
            try {
              const saved = Number(localStorage.getItem(visitStorageKey));
              const guarded = getCookieValue(visitGuardCookie);

              if (guarded) {
                return Number.isFinite(saved) && saved >= 100 ? saved : 100;
              }

              const nextValue =
                Number.isFinite(saved) && saved >= 100 ? saved + 1 : 100;
              localStorage.setItem(visitStorageKey, String(nextValue));
              setCookieValue(visitGuardCookie, "1", visitGuardSeconds);
              return nextValue;
            } catch {
              return 100;
            }
          }

          const value = Number(node.dataset.countTarget);
          return Number.isFinite(value) ? value : null;
        };

        const animateMetrics = async () => {
          await new Promise((resolve) => window.setTimeout(resolve, 330));

          const jobs = metricNodes.map(async (node) => {
            const target = await getCounterTarget(node);
            if (target === null) {
              node.textContent = "—";
              return;
            }

            const suffix = node.dataset.countSuffix || "";
            node.textContent = "0";
            runSpinCounter(node, target, { suffix });
          });

          await Promise.all(jobs);
        };

        const statsRow = document.querySelector(".hero-stats");
        let countersStarted = false;
        const startCountersOnce = () => {
          if (countersStarted) {
            return;
          }

          countersStarted = true;
          animateMetrics();
        };

        if (statsRow && "IntersectionObserver" in window) {
          const observer = new IntersectionObserver(
            (entries, io) => {
              if (entries.some((entry) => entry.isIntersecting)) {
                io.disconnect();
                startCountersOnce();
              }
            },
            { threshold: 0.35 },
          );

          observer.observe(statsRow);
        } else {
          startCountersOnce();
        }
      })();

        const buttons = Array.from(document.querySelectorAll("[data-tab-target]"));
        const panels = Array.from(document.querySelectorAll("[role='tabpanel']"));
        const gridMap = new Map(
          panels.map((panel) => [panel.id, panel.querySelector("[data-story-grid]")]),
        );

        const animatePanel = (panel) => {
          panel.animate(
            [
              { opacity: 0, transform: "translateY(8px)" },
              { opacity: 1, transform: "translateY(0)" },
            ],
            {
              duration: 200,
              easing: "ease-out",
            },
          );
        };

        const renderGrid = (panel) => {
          const items = storySets[panel.id] || [];
          const grid = gridMap.get(panel.id);

          if (!grid || grid.dataset.rendered === "true") {
            return;
          }

          const startNumber = Number(panel.dataset.start || "1");
          const letter = tabLetters[panel.id] || "";

          grid.textContent = "";

          items.forEach(([href, title], index) => {
            const number = startNumber + index;
            const isPlaceholder = href === "#";
            const card = document.createElement(isPlaceholder ? "div" : "a");

            card.className = isPlaceholder
              ? "story-item story-item--placeholder"
              : "story-item";
            if (!isPlaceholder) {
              card.href = href;
              card.setAttribute("aria-label", String(number) + ". " + title);
            } else {
              card.setAttribute("aria-disabled", "true");
            }
            card.innerHTML = isPlaceholder
              ? '<span class="story-title">' + title + '</span>'
              : '<span class="story-number">' + number + '</span>' +
                '<span class="story-title">' + title + '</span>' +
                '<span class="story-arrow" aria-hidden="true">→</span>';
            grid.appendChild(card);
          });

          grid.dataset.rendered = "true";
        };

        const activateTab = (tabId, { updateHash = true, focus = false } = {}) => {
          const targetButton = buttons.find(
            (button) => button.dataset.tabTarget === tabId,
          );
          const targetPanel = panels.find((panel) => panel.id === tabId);

          if (!targetButton || !targetPanel) {
            return;
          }

          buttons.forEach((button) => {
            const isActive = button === targetButton;
            button.setAttribute("aria-selected", String(isActive));
            button.tabIndex = isActive ? 0 : -1;
          });

          panels.forEach((panel) => {
            const isActive = panel === targetPanel;
            panel.hidden = !isActive;
            if (isActive) {
              renderGrid(panel);
              animatePanel(panel);
            }
          });

          if (focus) {
            targetButton.focus({ preventScroll: true });
          }

          if (updateHash) {
            history.replaceState(null, "", `#${tabId}`);
          }
        };

        buttons.forEach((button) => {
          button.addEventListener("click", () => {
            activateTab(button.dataset.tabTarget, { focus: true });
          });

          button.addEventListener("keydown", (event) => {
            const currentIndex = buttons.indexOf(button);
            let nextIndex = -1;

            switch (event.key) {
              case "ArrowLeft":
                event.preventDefault();
                nextIndex =
                  currentIndex === 0 ? buttons.length - 1 : currentIndex - 1;
                break;
              case "ArrowRight":
                event.preventDefault();
                nextIndex =
                  currentIndex === buttons.length - 1 ? 0 : currentIndex + 1;
                break;
              case "Home":
                event.preventDefault();
                nextIndex = 0;
                break;
              case "End":
                event.preventDefault();
                nextIndex = buttons.length - 1;
                break;
              case "Enter":
              case " ":
                event.preventDefault();
                activateTab(button.dataset.tabTarget, { focus: true });
                return;
              default:
                return;
            }

            if (nextIndex >= 0) {
              activateTab(buttons[nextIndex].dataset.tabTarget, { focus: true });
            }
          });
        });

        const initialTab = storySets[location.hash.slice(1)]
          ? location.hash.slice(1)
          : "stories-1";

        activateTab(initialTab, { updateHash: false });
      })();
