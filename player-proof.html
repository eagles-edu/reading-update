<!DOCTYPE html>
<html lang="en">
<head>
  <title>Audio Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Audio player with equalizer controls">
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; media-src https://eagles.io.vn; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:;">
<link rel="stylesheet" href="player-proof.css" integrity="sha384-6ivE++XizgAUZFBi2W14qpW7grvh2KXRc07AkMQakMgBs/F14XT0PeOk8cclwTS6">
</head>
<body class="player-proof-demo">

  <section class="audio-player eagles-player-shell" aria-label="Audio player with EQ controls">
    <audio id="audio" crossorigin="anonymous" preload="auto">
      <source src="https://eagles.io.vn/reading/_audio/easyread/audio/dict/dd165973/kid06401.mp3" type="audio/mp3">
    </audio>

    <div class="player-controls">
      <button class="play-btn" id="play-pause-btn" aria-label="Play" type="button">
        <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true" style="display: none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" /></svg>
      </button>

      <div class="timeline-container">
        <span id="current-time">0:00</span>
        <input type="range" id="progress" min="0" max="100" value="0" aria-label="Progress">
        <span id="duration">0:00</span>
      </div>

      <div class="volume-container">
        <div class="volume-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" /></svg>
        </div>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
      </div>
    </div>

    <div class="eq-section" role="group" aria-label="Low, mid, and high EQ controls">
      <div class="eq-stepper-grid">
        <div class="eq-stepper" data-band="low">
          <span class="eq-label">Lo</span>
          <button class="eq-stepper-btn" type="button" data-band="low" data-step="-1" aria-label="Lower low">&lt;</button>
          <output class="eq-value" aria-label="Low setting">0</output>
          <button class="eq-stepper-btn" type="button" data-band="low" data-step="1" aria-label="Raise low">&gt;</button>
        </div>
        <div class="eq-stepper" data-band="mid">
          <span class="eq-label">Mid</span>
          <button class="eq-stepper-btn" type="button" data-band="mid" data-step="-1" aria-label="Lower mid">&lt;</button>
          <output class="eq-value" aria-label="Mid setting">0</output>
          <button class="eq-stepper-btn" type="button" data-band="mid" data-step="1" aria-label="Raise mid">&gt;</button>
        </div>
        <div class="eq-stepper" data-band="high">
          <span class="eq-label">Hi</span>
          <button class="eq-stepper-btn" type="button" data-band="high" data-step="-1" aria-label="Lower high">&lt;</button>
          <output class="eq-value" aria-label="High setting">0</output>
          <button class="eq-stepper-btn" type="button" data-band="high" data-step="1" aria-label="Raise high">&gt;</button>
        </div>
      </div>
    </div>
  </section>

<template id="tone-script-template"><script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js" integrity="sha384-NWoslxaf/3dYwQk+uGziDYJFdsjBpVlU1WpFRexuDFcIk/5PJpCbpVXia2Uikeix" crossorigin="anonymous"></script></template>
<script src="player-proof.js" integrity="sha384-qEkHDwtOmaACTGG9039me/zsAaZtIPY9TFpMYr2WEa+rc45pfIk+KFjHNkc+hJHt"></script>
</body>
</html>
