# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    
    server_name thuvien.eagles.edu.vn www.thuvien.eagles.edu.vn;

    # Block common exploit attempts
    # location ~* (shell|cgi-bin|\.env|\.git|wp-admin|wp-login) {
    #    return 403;
    # }

    # Block suspicious query strings (command injection, LFI, RFI, SQLi)
    # if ($query_string ~* "(<|>|%3C|%3E|;|%3B|\\|\`|\$|\{|\}|\[|\]|&|%26|\*|%2A|wget|curl|
    #     bash|sh|nc|netcat|python|perl|php|system\(|exec\()") {
    #     return 403;
    # }

    # Block known botnets by User-Agent
    # if ($http_user_agent ~* "(masscan|sqlmap|nmap|nikto|acunetix|wpscan|curl|python|java
    #    |httpclient|Go-http-client|wget)") {
    #    return 403;
    # }    

    # Redirect everything else to https://*
	return 301 https://$host$request_uri;

 
    error_log /var/log/nginx/thuvien_eagles_edu_error_80.log warn;
    access_log /var/log/nginx/thuvien_eagles_edu_access_80.log;
}

# HTTPS server configuration
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	root /home/thuvien.eagles.edu.vn/public_html;
	index index.html;
    server_name thuvien.eagles.edu.vn www.thuvien.eagles.edu.vn;

    location = /favicon.ico {
        alias   /home/thuvien.eagles.edu.vn/public_html/favicon.ico;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    
    # SSL certificates and settings  
    ssl_certificate /root/.acme.sh/thuvien.eagles.edu.vn_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/thuvien.eagles.edu.vn_ecc/thuvien.eagles.edu.vn.key;

    # Enable OCSP stapling
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # Set supported protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;

    # Compression for proxied responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/x-javascript application/json application/ld+json application/xml application/xhtml+xml image/svg+xml application/x-font-ttf application/x-font-opentype application/vnd.ms-fontobject application/font-woff application/font-woff2 font/woff font/woff2 font/ttf font/opentype;

    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css text/javascript application/javascript application/x-javascript application/json application/ld+json application/xml application/xhtml+xml image/svg+xml application/x-font-ttf application/x-font-opentype application/vnd.ms-fontobject application/font-woff application/font-woff2 font/woff font/woff2 font/ttf font/opentype;

    # SSL session optimizations
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # DNS resolver for OCSP and backend name resolution
    resolver 8.8.8.8 203.113.131.2 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin";
    add_header Strict-Transport-Security "max-age=31536000" always;
    
	add_header Content-Security-Policy "default-src 'self' eagles.edu.vn; script-src * blob: 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://cdn.ampproject.org https://translate.googleapis.com https://ajax.googleapis.com/ https://*.googleapis.com/ https://ajax.googleapis.com/; style-src * 'unsafe-inline' https://cdn.ampproject.org; img-src * data: https://cdn.ampproject.org https://via.placeholder.com; font-src *; connect-src * https://cdn.ampproject.org; media-src *; object-src *; worker-src 'self' blob:; frame-src 'self' https://www.googletagmanager.com https://youtube.com https://*.youtube.vn https://*.hcaptcha.com https://hcaptcha.com https://www.google.com https://google.com eaglesvn.com; frame-ancestors https://anhngu.eagles.edu.vn" always;   
 
    # GeoIP Block & Malicious Bot Protection
    if ($block_country = 1) {
        return 403 "Access Denied - GeoIP Blocked";
    }

    if ($bad_bot = 1) {
        return 403 "Forbidden: Malicious bot detected.";
    }

    # Main location block
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        # Forward Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        # Rate Limiting
        limit_req zone=api_limit burst=80;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Keep buffering on so nginx can compress upstream responses.
        proxy_buffering on;
    }
    
    # == Exercise Mailer API ==
    # Accept both with and without trailing slash; forward EXACT endpoint to Node
  
    location ~* ^/api/exercise-submission/?$ {
		# normalize to exact path your Node expects
		rewrite ^/api/exercise-submission/?$ /api/exercise-submission break;

		proxy_pass         http://127.0.0.1:8787;
		proxy_http_version 1.1;

		proxy_set_header   Host              $host;
		proxy_set_header   X-Forwarded-For   $remote_addr;
		proxy_set_header   X-Forwarded-Proto $scheme;
		proxy_set_header   Connection        "";

		proxy_read_timeout 60s;
		proxy_send_timeout 60s;

		# keep request body limits reasonable
		client_max_body_size 256k;
	  }

    # Health endpoint
	location = /healthz {
		# Only allow requests originating from THIS machine:
		allow 127.0.0.1;   # IPv4 localhost
		# allow ::1;         # IPv6 localhost
		deny  all;         # everything else gets 403

		proxy_pass http://127.0.0.1:8787/healthz;
		proxy_set_header Host $host;
	}

	# Logging for HTTPS server
	error_log /var/log/nginx/thuvien_eagles_edu_error_443.log warn;
	access_log /var/log/nginx/thuvien_eagles_edu_access_443.log;
}



